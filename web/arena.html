<!doctype html>
<meta charset="utf-8">
<title>shprout arena</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0e14; color: #cbd5e1; font: 13px system-ui; }
  * { box-sizing: border-box; }
  #header { padding: 14px 16px; display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid #232a3a; }
  #header h1 { font-size: 18px; margin: 0; color: #e2e8f0; }
  #header .tagline { color: #64748b; font-size: 12px; }
  #header .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 4px; padding: 6px 12px; background: #2563eb; color: white; }
  button.auth { background: #16a34a; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.stop { background: #b91c1c; }
  #status { color: #94a3b8; }

  #taskbar { padding: 10px 16px; border-bottom: 1px solid #232a3a; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { background: #131824; border: 1px solid #232a3a; color: #cbd5e1; padding: 5px 10px; border-radius: 999px; font-size: 12px; }
  .chip:hover { border-color: #3b4763; }
  #task { flex: 1 1 260px; background: #131824; color: #e2e8f0; border: 1px solid #232a3a; padding: 7px 10px; border-radius: 4px; font: inherit; min-width: 200px; }
  #judgeLabel { color: #94a3b8; display: flex; align-items: center; gap: 5px; white-space: nowrap; }

  #lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 16px; }
  @media (max-width: 860px) { #lanes { grid-template-columns: 1fr; } }

  .lane { background: #131824; border: 1px solid #232a3a; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .lane .laneHead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #232a3a; }
  .lane select { background: #0b0e14; color: #cbd5e1; border: 1px solid #232a3a; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .lane .accent { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #laneA .accent { background: #7dd3fc; }
  #laneB .accent { background: #fbbf24; }
  #laneA .laneHead { border-top: 2px solid #7dd3fc; }
  #laneB .laneHead { border-top: 2px solid #fbbf24; }
  .statusChip { padding: 2px 8px; border-radius: 999px; background: #1e293b; color: #94a3b8; font-size: 11px; }
  .statusChip.thinking { color: #7dd3fc; }
  .statusChip.painting { color: #fbbf24; }
  .statusChip.done { color: #4ade80; }
  .statusChip.stopped, .statusChip.error { color: #fca5a5; }
  .laneHead .turns, .laneHead .timer { color: #64748b; font-size: 11px; white-space: nowrap; }
  .laneHead .spacer { flex: 1; }
  .laneHead label.domToggle { color: #64748b; font-size: 11px; display: flex; align-items: center; gap: 3px; white-space: nowrap; }

  .stage { height: 420px; background: #fff; position: relative; overflow: hidden; }
  .metrics { padding: 8px 10px; border-top: 1px solid #232a3a; font-size: 11px; color: #94a3b8; min-height: 20px; }
  .metrics .bar { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .metrics .bar .track { flex: 1; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; max-width: 160px; }
  .metrics .bar .fill { height: 100%; background: #64748b; }
  .metrics .score { color: #e2e8f0; font-weight: 600; margin-top: 4px; }
  .metrics .judge { margin-top: 6px; color: #cbd5e1; }

  .log { height: 200px; overflow: auto; background: #0b0e14; border-top: 1px solid #232a3a; padding: 6px 8px; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
  .log .prose { color: #64748b; } .log .code { color: #7dd3fc; } .log .out { color: #a7f3d0; } .log .err { color: #fca5a5; } .log .dom { color: #c4a7e7; display: none; }
  .log.showdom .dom { display: block; }

  #verdict { margin: 0 16px 16px; padding: 16px; border-radius: 8px; background: #131824; border: 1px solid #232a3a; font-size: 15px; color: #e2e8f0; text-align: center; }
  #verdict.hidden { display: none; }
  #verdict .comment { display: block; margin-top: 6px; font-size: 12px; color: #94a3b8; font-weight: normal; }
</style>

<div id="header">
  <h1>shprout arena</h1>
  <span class="tagline">two agents, one task — pixels are the evidence</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="auth" class="auth" hidden>Authorize</button>
</div>

<div id="taskbar">
  <span class="chip" data-prompt="Draw a Barnsley fern with at least 50,000 chaos-game points on a &lt;canvas&gt; that fills your stage. Deep greens on a near-black background. When it looks right, return []." title="Draw a Barnsley fern with at least 50,000 chaos-game points on a <canvas> that fills your stage. Deep greens on a near-black background. When it looks right, return [].">🌿 Fern</span>
  <span class="chip" data-prompt="Render the Mandelbrot set on a &lt;canvas&gt; that fills your stage with smooth escape-time coloring. When it looks right, return []." title="Render the Mandelbrot set on a <canvas> that fills your stage with smooth escape-time coloring. When it looks right, return [].">🌀 Mandelbrot</span>
  <span class="chip" data-prompt="Draw a Sierpinski triangle via the chaos game with 100,000 points on a &lt;canvas&gt; filling your stage, warm palette on a dark background. When it looks right, return []." title="Draw a Sierpinski triangle via the chaos game with 100,000 points on a <canvas> filling your stage, warm palette on a dark background. When it looks right, return [].">🔺 Sierpinski</span>
  <span class="chip" data-prompt="Grow a recursive fractal tree on a &lt;canvas&gt; filling your stage — brown trunk fading to green tips, with slight randomness so it looks organic. When it looks right, return []." title="Grow a recursive fractal tree on a <canvas> filling your stage — brown trunk fading to green tips, with slight randomness so it looks organic. When it looks right, return [].">🌳 Tree</span>
  <span class="chip" data-prompt="Draw an animated spirograph with three nested epicycles tracing a colorful curve on a &lt;canvas&gt; filling your stage. Once the animation is running, return []." title="Draw an animated spirograph with three nested epicycles tracing a colorful curve on a <canvas> filling your stage. Once the animation is running, return [].">🎡 Spirograph</span>
  <span class="chip" data-prompt="Paint a spiral galaxy on a &lt;canvas&gt; filling your stage: dense starfield plus two logarithmic spiral arms and a glowing core. When it looks right, return []." title="Paint a spiral galaxy on a <canvas> filling your stage: dense starfield plus two logarithmic spiral arms and a glowing core. When it looks right, return [].">🌌 Galaxy</span>
  <input id="task" placeholder="describe a visual task for both agents…">
  <label id="judgeLabel"><input type="checkbox" id="judge" checked> AI judge</label>
  <button id="race" disabled>Race</button>
  <button id="stop" class="stop">Stop</button>
</div>

<div id="lanes">
  <div class="lane" id="laneA">
    <div class="laneHead">
      <span class="accent"></span>
      <select id="modelA"></select>
      <span class="statusChip" id="chipA">idle</span>
      <span class="turns" id="turnsA">turn 0</span>
      <span class="timer" id="timerA">0.0s</span>
      <span class="spacer"></span>
      <label class="domToggle"><input type="checkbox" id="domA"> dom</label>
    </div>
    <div class="stage" id="stageA"></div>
    <div class="metrics" id="metricsA"></div>
    <div class="log" id="logA"></div>
  </div>
  <div class="lane" id="laneB">
    <div class="laneHead">
      <span class="accent"></span>
      <select id="modelB"></select>
      <span class="statusChip" id="chipB">idle</span>
      <span class="turns" id="turnsB">turn 0</span>
      <span class="timer" id="timerB">0.0s</span>
      <span class="spacer"></span>
      <label class="domToggle"><input type="checkbox" id="domB"> dom</label>
    </div>
    <div class="stage" id="stageB"></div>
    <div class="metrics" id="metricsB"></div>
    <div class="log" id="logB"></div>
  </div>
</div>

<div id="verdict" class="hidden"></div>

<script type="module">
  import { jsprout } from './agent.js';

  // ---------- auth (mirrors jsprout.html) ----------
  const APP_KEY = 'pk_xMe0kHLHGca6k7lf';
  const STORE = 'shprout.apiKey';
  const LEGACY_STORE = 'jsprout.apiKey';
  const frag = new URLSearchParams(location.hash.slice(1));
  const authError = frag.get('error');
  if (frag.get('api_key')) {
    localStorage.setItem(STORE, frag.get('api_key'));
    history.replaceState(null, '', location.pathname + location.search);
  } else if (authError) {
    history.replaceState(null, '', location.pathname + location.search);
  }
  const key = localStorage.getItem(STORE) || localStorage.getItem(LEGACY_STORE);
  if (key && !localStorage.getItem(STORE)) localStorage.setItem(STORE, key);

  const $ = id => document.getElementById(id);
  $('auth').onclick = () => {
    const u = new URL('https://enter.pollinations.ai/authorize');
    u.searchParams.set('client_id', APP_KEY);
    u.searchParams.set('redirect_uri', location.origin + location.pathname);
    location.href = u.toString();
  };
  if (authError) { $('auth').hidden = false; $('status').textContent = `authorization failed: ${authError}`; }
  else if (key) { $('race').disabled = false; $('status').textContent = 'ready'; }
  else { $('auth').hidden = false; $('status').textContent = 'not authorized'; }

  // ---------- models + presets ----------
  const MODELS = ['claude-large', 'claude', 'claude-fast', 'gpt-5.4', 'openai-large', 'gemini-3-flash', 'gemini', 'grok', 'mistral', 'deepseek', 'kimi', 'qwen-coder'];
  for (const sel of [$('modelA'), $('modelB')]) {
    sel.innerHTML = MODELS.map(m => `<option value="${m}">${m}</option>`).join('');
  }
  $('modelA').value = 'claude-large';
  $('modelB').value = 'gemini-3-flash';

  const FERN = "Draw a Barnsley fern with at least 50,000 chaos-game points on a <canvas> that fills your stage. Deep greens on a near-black background. When it looks right, return [].";

  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => { $('task').value = chip.dataset.prompt; $('task').focus(); };
  });
  document.querySelectorAll('#domA, #domB').forEach(cb => {
    cb.onchange = () => $(cb.id === 'domA' ? 'logA' : 'logB').classList.toggle('showdom', cb.checked);
  });

  // ---------- lane state ----------
  let controller = null;

  function laneShow(laneId) {
    const logEl = $(laneId === 'A' ? 'logA' : 'logB');
    const chip = $(laneId === 'A' ? 'chipA' : 'chipB');
    const turnsEl = $(laneId === 'A' ? 'turnsA' : 'turnsB');
    let turns = 0;
    return (cls, text) => {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = cls === 'prose' ? text.split('\n').map(l => '> ' + l).join('\n')
        : cls === 'code' ? '```js\n' + text + '\n```'
        : text;
      logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
      if (cls === 'dom') { chip.textContent = 'thinking…'; chip.className = 'statusChip thinking'; }
      if (cls === 'code') { turns++; turnsEl.textContent = `turn ${turns}`; chip.textContent = 'painting'; chip.className = 'statusChip painting'; }
    };
  }

  function startTimer(laneId) {
    const timerEl = $(laneId === 'A' ? 'timerA' : 'timerB');
    const t0 = performance.now();
    const id = setInterval(() => {
      timerEl.textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);
    return () => clearInterval(id);
  }

  async function runLane(laneId, task, model, signal) {
    const chip = $(laneId === 'A' ? 'chipA' : 'chipB');
    const stageEl = $(laneId === 'A' ? 'stageA' : 'stageB');
    chip.textContent = 'thinking…'; chip.className = 'statusChip thinking';
    const stopTimer = startTimer(laneId);
    try {
      await jsprout({ task, model, key, show: laneShow(laneId), stage: stageEl, budget: 12, signal });
      if (signal.aborted) { chip.textContent = 'stopped'; chip.className = 'statusChip stopped'; }
      else { chip.textContent = 'done'; chip.className = 'statusChip done'; }
    } catch (e) {
      if (signal.aborted) { chip.textContent = 'stopped'; chip.className = 'statusChip stopped'; }
      else {
        chip.textContent = 'error'; chip.className = 'statusChip error';
        const logEl = $(laneId === 'A' ? 'logA' : 'logB');
        const div = document.createElement('div'); div.className = 'err'; div.textContent = e.message || String(e);
        logEl.appendChild(div);
      }
    } finally {
      stopTimer();
    }
  }

  // ---------- measurement: pixel evidence ----------
  function measure(stageEl) {
    const canvases = [...stageEl.querySelectorAll('canvas')];
    const box = stageEl.getBoundingClientRect();
    const W = Math.max(1, Math.round(box.width)), H = Math.max(1, Math.round(box.height));
    if (canvases.length === 0) {
      return { noCanvas: true, nodes: stageEl.querySelectorAll('*').length };
    }
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const ctx = off.getContext('2d');
    try {
      for (const c of canvases) {
        // draw at display size — agents often set internal resolution ≠ CSS size
        ctx.drawImage(c, c.offsetLeft || 0, c.offsetTop || 0, c.clientWidth || c.width, c.clientHeight || c.height);
      }
      const { data } = ctx.getImageData(0, 0, W, H);
      const buckets = new Map();
      let minX = W, minY = H, maxX = 0, maxY = 0, inkCount = 0;
      const n = data.length / 4;
      for (let i = 0; i < n; i++) {
        const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
        const key = `${r>>5},${g>>5},${b>>5}`;
        buckets.set(key, (buckets.get(key) || 0) + 1);
      }
      let bgKey = null, bgCount = -1;
      for (const [k, c] of buckets) if (c > bgCount) { bgCount = c; bgKey = k; }
      const [br, bg, bb] = bgKey.split(',').map(x => x * 32);
      for (let i = 0; i < n; i++) {
        const idx = i * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        const dist = Math.max(Math.abs(r-br), Math.abs(g-bg), Math.abs(b-bb));
        if (dist > 24) {
          inkCount++;
          const x = i % W, y = (i / W) | 0;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      const ink = inkCount / n;
      const palette = buckets.size;
      const spread = inkCount > 0 ? ((maxX - minX + 1) * (maxY - minY + 1)) / (W * H) : 0;
      const score = 0.5 * Math.min(1, ink * 4) + 0.3 * Math.min(1, palette / 24) + 0.2 * spread;
      return { ink, palette, spread, score, canvas: off };
    } catch (e) {
      return { noCanvas: true, nodes: stageEl.querySelectorAll('*').length, tainted: true };
    }
  }

  function renderMetrics(laneId, m) {
    const el = $(laneId === 'A' ? 'metricsA' : 'metricsB');
    if (m.noCanvas) {
      el.innerHTML = `<div>no canvas found (${m.nodes} nodes)${m.tainted ? ' — tainted canvas' : ''}</div>`;
      return;
    }
    const bar = (label, frac, text) => `
      <div class="bar"><span style="width:48px;display:inline-block">${label}</span>
        <span class="track"><span class="fill" style="width:${Math.round(Math.min(1,frac)*100)}%"></span></span>
        <span>${text}</span></div>`;
    el.innerHTML =
      bar('ink', m.ink * 4, m.ink.toFixed(3)) +
      bar('palette', m.palette / 24, m.palette) +
      bar('spread', m.spread, m.spread.toFixed(3)) +
      `<div class="score">pixel score ${m.score.toFixed(2)}</div>`;
  }

  function appendJudge(laneId, text) {
    const el = $(laneId === 'A' ? 'metricsA' : 'metricsB');
    const div = document.createElement('div');
    div.className = 'judge';
    div.textContent = text;
    el.appendChild(div);
  }

  // ---------- AI judge ----------
  function downscale(canvas, maxW = 512) {
    if (canvas.width <= maxW) return canvas;
    const scale = maxW / canvas.width;
    const c = document.createElement('canvas');
    c.width = maxW; c.height = Math.round(canvas.height * scale);
    c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
    return c;
  }

  async function judgeLane(canvas, task) {
    const small = downscale(canvas);
    const dataUri = small.toDataURL('image/png');
    const body = {
      model: 'gemini-3-flash',
      messages: [{
        role: 'user',
        content: [
          { type: 'text', text: `Score 0-10 how well this image depicts: "${task}". Reply with ONLY JSON: {"score": n, "comment": "one punchy sentence"}` },
          { type: 'image_url', image_url: { url: dataUri } },
        ],
      }],
    };
    const r = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    const content = j.choices[0].message.content;
    const match = content.match(/\{[\s\S]*?\}/);
    if (!match) throw new Error('no json in judge reply');
    const parsed = JSON.parse(match[0]);
    if (typeof parsed.score !== 'number') throw new Error('bad judge json');
    return parsed;
  }

  // ---------- confetti ----------
  function confetti(laneEl) {
    const stageEl = laneEl.querySelector('.stage');
    const c = document.createElement('canvas');
    c.style.position = 'absolute'; c.style.top = 0; c.style.left = 0;
    c.style.pointerEvents = 'none';
    const rect = stageEl.getBoundingClientRect();
    c.width = rect.width; c.height = rect.height;
    stageEl.style.position = 'relative';
    stageEl.appendChild(c);
    const ctx = c.getContext('2d');
    const colors = ['#7dd3fc', '#fbbf24', '#4ade80', '#f472b6', '#c4a7e7', '#f87171'];
    const parts = Array.from({ length: 50 }, () => ({
      x: c.width / 2, y: c.height / 2,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 1.4) * 8,
      color: colors[(Math.random() * colors.length) | 0],
      size: 3 + Math.random() * 4, rot: Math.random() * Math.PI,
    }));
    const t0 = performance.now();
    function frame() {
      const elapsed = performance.now() - t0;
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of parts) {
        p.vy += 0.25;
        p.x += p.vx; p.y += p.vy; p.rot += 0.2;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
      if (elapsed < 1500) requestAnimationFrame(frame);
      else c.remove();
    }
    requestAnimationFrame(frame);
  }

  // ---------- verdict ----------
  function showVerdict(nameA, mA, jA, nameB, mB, jB) {
    const verdictEl = $('verdict');
    verdictEl.classList.remove('hidden');

    if (mA.noCanvas && mB.noCanvas) {
      verdictEl.innerHTML = `🤷 neither agent produced a canvas`;
      return;
    }
    if (mA.noCanvas) {
      verdictEl.innerHTML = `🏆 ${nameB} takes it — ${nameA} produced no canvas`;
      confetti($('laneB')); return;
    }
    if (mB.noCanvas) {
      verdictEl.innerHTML = `🏆 ${nameA} takes it — ${nameB} produced no canvas`;
      confetti($('laneA')); return;
    }

    let scoreA, scoreB, byJudge = false, comment = '';
    if (jA && jB) {
      scoreA = jA.score; scoreB = jB.score; byJudge = true;
    } else {
      scoreA = mA.score * 10; scoreB = mB.score * 10;
    }

    if (Math.abs(scoreA - scoreB) < 1e-9) {
      verdictEl.innerHTML = `🤝 dead heat — ${nameA} and ${nameB} tie at ${scoreA.toFixed(byJudge ? 0 : 2)}${byJudge ? '/10' : ''}`;
      return;
    }
    const aWins = scoreA > scoreB;
    const winnerName = aWins ? nameA : nameB;
    const winScore = aWins ? scoreA : scoreB;
    const loseScore = aWins ? scoreB : scoreA;
    if (byJudge) comment = aWins ? (jA.comment || '') : (jB.comment || '');
    const fmt = n => byJudge ? `${Math.round(n)}/10` : n.toFixed(2);
    const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    verdictEl.innerHTML = `🏆 ${winnerName} takes it — ${fmt(winScore)} vs ${fmt(loseScore)}` +
      (comment ? `<span class="comment">${esc(comment)}</span>` : '');
    confetti(aWins ? $('laneA') : $('laneB'));
  }

  // ---------- race orchestration ----------
  async function race() {
    if (controller) controller.abort();
    controller = new AbortController();
    const signal = controller.signal;

    const task = $('task').value.trim() || FERN;
    $('task').value = task;

    for (const l of ['A', 'B']) {
      $(`stage${l}`).innerHTML = '';
      $(`log${l}`).innerHTML = '';
      $(`metrics${l}`).innerHTML = '';
      $(`chip${l}`).textContent = 'idle'; $(`chip${l}`).className = 'statusChip';
      $(`turns${l}`).textContent = 'turn 0';
      $(`timer${l}`).textContent = '0.0s';
    }
    $('verdict').classList.add('hidden');
    $('verdict').innerHTML = '';
    $('status').textContent = 'racing…';

    const modelA = $('modelA').value, modelB = $('modelB').value;
    const results = await Promise.allSettled([
      runLane('A', task, modelA, signal),
      runLane('B', task, modelB, signal),
    ]);

    $('status').textContent = signal.aborted ? 'stopped' : 'measuring…';
    if (signal.aborted) return;

    const mA = measure($('stageA'));
    const mB = measure($('stageB'));
    renderMetrics('A', mA);
    renderMetrics('B', mB);

    let jA = null, jB = null;
    if ($('judge').checked) {
      const jobs = [];
      if (!mA.noCanvas) jobs.push(judgeLane(mA.canvas, task).then(r => jA = r).catch(() => appendJudge('A', 'judge unavailable')));
      if (!mB.noCanvas) jobs.push(judgeLane(mB.canvas, task).then(r => jB = r).catch(() => appendJudge('B', 'judge unavailable')));
      await Promise.allSettled(jobs);
      if (jA) appendJudge('A', `judge: ${jA.score}/10 — ${jA.comment || ''}`);
      if (jB) appendJudge('B', `judge: ${jB.score}/10 — ${jB.comment || ''}`);
    }

    $('status').textContent = 'ready';
    showVerdict(modelA, mA, jA, modelB, mB, jB);
  }

  $('race').onclick = () => race().catch(e => { $('status').textContent = 'error: ' + e.message; });
  $('stop').onclick = () => { if (controller) controller.abort(); };
  $('task').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('race').disabled) race(); });
</script>
