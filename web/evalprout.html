<!doctype html>
<meta charset="utf-8">
<title>evalprout — compress the agent, in your tab</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui; }
  body { display: grid; grid-template-rows: auto 1fr; }
  #bar { padding: 6px 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; flex-wrap: wrap; }
  #bar label { color: #aaa; display: flex; gap: 4px; align-items: center; }
  #bar input[type=number] { width: 3.5em; background: #222; color: #eee; border: 1px solid #444; padding: 4px 6px; border-radius: 4px; font: inherit; }
  #bar button { background: #2563eb; color: white; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
  #bar button.auth { background: #16a34a; }
  #bar button.stop { background: #dc2626; }
  #bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #main { display: grid; grid-template-columns: minmax(430px, 44%) 1fr; min-height: 0; }
  #board { border-right: 1px solid #333; overflow: auto; padding: 8px; }
  #board table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #board th { text-align: left; color: #888; font-weight: 500; padding: 4px 6px; border-bottom: 1px solid #333; position: sticky; top: 0; background: #111; }
  #board td { padding: 4px 6px; border-bottom: 1px solid #1c1c1c; font-family: ui-monospace, monospace; font-size: 12px; }
  #board tr { cursor: pointer; }
  #board tr:hover td { background: #1a1a2e; }
  #board tr.champ td { color: #bc8cff; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .meh { color: #fbbf24; }
  #log { overflow: auto; padding: 8px; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
  #log .prose { color: #888; } #log .code { color: #7dd3fc; } #log .out { color: #a7f3d0; }
  #log .err { color: #fca5a5; } #log .win { color: #c4a7e7; font-weight: 600; }
  #log .live { color: #9ca3af; border-left: 2px solid #2d3748; margin: 2px 0 8px 4px; padding-left: 8px; }
  #log .livehead { color: #60a5fa; margin-top: 6px; }
</style>

<div id="bar">
  <button id="run" disabled>Run search</button>
  <button id="stop" class="stop" hidden>Stop</button>
  <label>budget <input id="budget" type="number" value="6" min="0" max="40"></label>
  <label><input id="fast" type="checkbox"> fast mode (skip micro-bench, gate only)</label>
  <button id="auth" class="auth" hidden>Authorize</button>
  <span id="status" style="color:#888"></span>
</div>
<div id="main">
  <div id="board">
    <table>
      <thead><tr><th>bytes</th><th>best</th><th>mean</th><th>fails</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="log"></div>
</div>

<script type="module">
  import { WebContainer } from 'https://esm.sh/@webcontainer/api@1.5.1';

  const APP_KEY = 'pk_xMe0kHLHGca6k7lf';
  const KEY_STORE = 'shprout.apiKey';
  const POLLI_AUTH = 'https://enter.pollinations.ai/authorize';
  const POLLI_BASE = 'https://gen.pollinations.ai/v1';
  const GEN_MODEL = 'claude-large';      // decompressor + proposer
  const RUNTIME_MODEL = 'claude';        // what generated agents think with
  const N_SAMPLES = 2;                   // gen samples per prompt
  const T2_POOL = 2;                     // concurrent micro-bench tasks

  const $ = id => document.getElementById(id);
  const setStatus = s => $('status').textContent = s;
  const show = (cls, text) => {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    $('log').appendChild(div);
    $('log').scrollTop = $('log').scrollHeight;
  };
  // one growing block per gate process, so parallel streams stay readable
  const stripAnsi = s => s.replace(/\[[0-9;]*[A-Za-z]/g, '').replace(/\r/g, '');
  const liveBlock = label => {
    show('livehead', `▶ ${label}`);
    const div = document.createElement('div');
    div.className = 'live';
    $('log').appendChild(div);
    return chunk => {
      div.textContent += stripAnsi(chunk);
      $('log').scrollTop = $('log').scrollHeight;
    };
  };

  // ------------------------------------------------------------------ auth
  const frag = new URLSearchParams(location.hash.slice(1));
  if (frag.get('api_key')) {
    localStorage.setItem(KEY_STORE, frag.get('api_key'));
    history.replaceState(null, '', location.pathname + location.search);
  }
  let apiKey = localStorage.getItem(KEY_STORE);
  $('auth').onclick = () => {
    const u = new URL(POLLI_AUTH);
    u.searchParams.set('client_id', APP_KEY);
    u.searchParams.set('redirect_uri', location.origin + location.pathname);
    location.href = u.toString();
  };

  // ------------------------------------------------------------------ LLM
  async function llm(model, messages, { temperature = 0, seed } = {}) {
    const body = { model, messages };
    if (temperature !== null) body.temperature = temperature;
    if (seed !== undefined) body.seed = seed;
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = await fetch(`${POLLI_BASE}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
        body: JSON.stringify(body),
      });
      if (r.status === 429 || r.status >= 500) { await new Promise(res => setTimeout(res, 8000 * (attempt + 1))); continue; }
      const j = await r.json();
      if (!r.ok) throw new Error(`llm ${r.status}: ${JSON.stringify(j).slice(0, 160)}`);
      return j.choices?.[0]?.message?.content ?? '';
    }
    throw new Error('llm: retries exhausted');
  }
  // gen replies are often full markdown docs — take the first fenced block
  const stripFence = s => {
    const m = s.match(/```[^\n]*\n([\s\S]*?)\n```/);
    return (m ? m[1] : s).trim();
  };

  // ------------------------------------------------- seeds + proposer spec
  // Node flavor of the shprout spec: same five executed behaviors, .mjs world.
  const SEEDS = [
    // verbose anchor — should decompress into a fully passing agent
    "Write a single Node.js ESM script (.mjs, top-level await, no dependencies). " +
    "It is a self-prompting agent. Read env vars OPENAI_API_KEY, MODEL, OPENAI_BASE_URL " +
    "(exactly these names; exit early if missing). Build prompt = the script's own source " +
    "(read its own file via process.argv[1]) + the task string process.argv[2]. Loop up to " +
    "12 times: POST JSON {model: MODEL, messages:[{role:'user',content:prompt}]} to " +
    "OPENAI_BASE_URL + '/chat/completions' with header Authorization: Bearer key, using fetch; " +
    "reply = json.choices[0].message.content. If the reply contains ``` fences keep only the " +
    "fenced code. If the reply is empty or exactly 'exit', stop. Otherwise run the reply as " +
    "JavaScript inside an async function, capturing console.log output and any thrown error " +
    "as text (never crash). Print the reply and the output. Append reply and output to prompt.",
    // aggressive short seed (Node translation of the bash champion's shape)
    "Node .mjs self-prompting agent. Env: OPENAI_API_KEY MODEL OPENAI_BASE_URL. " +
    "prompt = own source (read process.argv[1]) + task process.argv[2]. Loop <=12: " +
    "fetch POST {model:MODEL,messages:[{role:user,content:prompt}]} to OPENAI_BASE_URL/chat/completions, " +
    "Authorization: Bearer key; reply=choices[0].message.content; strip ``` fences; " +
    "stop if reply empty or ==\"exit\"; run reply as async JS, capture console output+errors; " +
    "append reply+output to prompt.",
  ];

  const PROPOSER_SYS = `You compress a natural-language prompt whose job is to make a capable LLM
write a small Node.js ESM script — a self-prompting agent. The script is judged by EXECUTION,
not by style. It must actually:

  1. read env vars OPENAI_API_KEY, MODEL, OPENAI_BASE_URL (exactly these names)
  2. include its own source (read its own file, process.argv[1]) plus the task
     (process.argv[2]) in the prompt
  3. loop (<=20): POST OpenAI chat shape to OPENAI_BASE_URL/chat/completions with
     Bearer auth via fetch; extract .choices[0].message.content
  4. strip \`\`\` fences when present, run the reply as JavaScript (async, capturing
     console output and errors without crashing), and STOP on empty reply or the
     literal reply "exit"
  5. append reply + output to the prompt (cumulative history)

The generated script is executed against a scripted fake fetch (checks 2-5 by tracing real
requests) and then on a 6-task micro-bench with a real model. The LEADERBOARD below shows
candidates with byte length, bench score (0-1), and executed-failure diagnostics.

Your goal: propose ONE new prompt that is SHORTER than the shortest passing candidate while
still passing (score >= the bar shown). Any compression trick — abbreviations, symbols,
dropped articles — but the five behaviors must come through unambiguously. Common deaths:
the script crashes on the first eval error, forgets to append history, or never stops.

Reply with ONLY the new prompt text. No quotes, no fences, no commentary.`;

  // ------------------------------------------------------------- the gate
  let wc;
  const cache = new Map();
  const state = { stop: false, running: false };

  async function boot() {
    setStatus('booting WebContainer…');
    wc = await WebContainer.boot();
    window.wc = wc;
    const runner = await fetch('/gate-runner.mjs').then(r => r.text());
    await wc.mount({
      'gate-runner.mjs': { file: { contents: runner } },
      'package.json': { file: { contents: '{"name":"evalprout","type":"module","private":true}' } },
    });
    setStatus('ready');
    $('run').disabled = false;
  }

  let procSeq = 0;
  async function spawnGate(args, env, timeoutMs, tag, label) {
    // relative path: the container's real / is read-only; wc.fs and the
    // process cwd are both rooted at the mounted workspace
    const resPath = `res-${++procSeq}.json`;
    const proc = await wc.spawn('node', ['gate-runner.mjs', ...args, resPath], { env });
    const live = liveBlock(label ?? tag);
    let out = '';
    proc.output.pipeTo(new WritableStream({ write: c => { out += c; live(c); } }));
    const killer = setTimeout(() => proc.kill(), timeoutMs);
    await proc.exit;
    clearTimeout(killer);
    try {
      return JSON.parse(await wc.fs.readFile(resPath, 'utf8'));
    } catch {
      return { pass: false, fails: [`${tag}:runner-died`], out: out.slice(-200) };
    }
  }

  function tier0(script) {
    const fails = [];
    if (script.length > 6144) fails.push('size>6KB'); // Node agents run wordier than bash
    for (const [label, needle] of [
      ['env:OPENAI_API_KEY', 'OPENAI_API_KEY'], ['env:OPENAI_BASE_URL', 'OPENAI_BASE_URL'],
      ['endpoint', 'chat/completions'], ['http:fetch', 'fetch'],
    ]) if (!script.includes(needle)) fails.push(`missing:${label}`);
    if (!/\b(for|while)\b/.test(script)) fails.push('missing:loop');
    if (!script.includes('argv') && !script.includes('import.meta')) fails.push('missing:self-read');
    return fails;
  }

  const T2_TASKS = ['mkfile', 'hash8', 'arith', 'grepcount', 'multistep', 'recover'];

  async function evaluateScript(script, label = '') {
    const fast = $('fast').checked;
    const keyBytes = await crypto.subtle.digest('SHA-256',
      new TextEncoder().encode(`${script}|${RUNTIME_MODEL}|${fast ? 'fast' : 'full'}`));
    const h = [...new Uint8Array(keyBytes)].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
    if (cache.has(h)) return cache.get(h);

    const result = { hash: h, bytes: script.length, score: 0, fails: tier0(script) };
    if (!result.fails.length) {
      const candPath = `cand-${h}.mjs`;
      await wc.fs.writeFile(candPath, script);
      const t1 = await spawnGate(['t1', candPath],
        { OPENAI_API_KEY: 'fake-key', MODEL: 'fake', OPENAI_BASE_URL: 'http://fake.invalid/v1' },
        35_000, 't1', `${label} · t1 loop trace (scripted fake API)`);
      result.fails.push(...(t1.fails ?? []));
      if (t1.pass) {
        if (fast) {
          result.score = 1;                            // gate-only mode
        } else {
          show('prose', `  micro-bench (6 tasks, ${RUNTIME_MODEL})…`);
          const results = [];
          const queue = [...T2_TASKS];
          await Promise.all(Array.from({ length: T2_POOL }, async () => {
            while (queue.length && !state.stop) {
              const t = queue.shift();
              const r = await spawnGate(['t2', t, candPath],
                { OPENAI_API_KEY: apiKey, MODEL: RUNTIME_MODEL, OPENAI_BASE_URL: POLLI_BASE },
                140_000, 't2', `${label} · t2:${t} (live agent ↔ ${RUNTIME_MODEL})`);
              results.push(r);
              show(r.pass ? 'out' : 'err', `    ${t}: ${r.pass ? 'pass' : 'FAIL'}`);
            }
          }));
          result.score = results.filter(r => r.pass).length / T2_TASKS.length;
          result.fails.push(...results.flatMap(r => r.fails ?? []));
        }
      }
    }
    cache.set(h, result);
    return result;
  }

  // ------------------------------------------------------------ the search
  const rows = [];
  function renderBoard(bar) {
    const best = Math.min(...rows.filter(r => r.best >= bar).map(r => r.length));
    $('rows').innerHTML = '';
    const ranked = [...rows].sort((a, b) => (b.best >= bar) - (a.best >= bar) || b.best - a.best || a.length - b.length);
    for (const r of ranked) {
      const tr = document.createElement('tr');
      if (r.best >= bar && r.length === best) tr.className = 'champ';
      const cls = v => v >= bar ? 'ok' : v > 0 ? 'meh' : 'bad';
      tr.innerHTML = `<td>${r.length}</td><td class="${cls(r.best)}">${r.best.toFixed(2)}</td>` +
        `<td class="${cls(r.mean)}">${r.mean.toFixed(2)}</td><td>${r.fails.slice(0, 3).join(' ') || '—'}</td>`;
      tr.onclick = () => { show('win', `--- prompt ${r.length}B (best ${r.best.toFixed(2)}) ---`); show('code', r.prompt); };
      $('rows').appendChild(tr);
    }
  }

  async function scorePrompt(prompt, label) {
    show('prose', `\n▸ ${label}: ${prompt.length}B`);
    const evals = [];
    for (let i = 0; i < N_SAMPLES && !state.stop; i++) {
      setStatus(`${label}: generating sample ${i + 1}/${N_SAMPLES}…`);
      let script;
      try { script = stripFence(await llm(GEN_MODEL, [{ role: 'user', content: prompt }], { seed: i })); }
      catch (e) { show('err', `  gen failed: ${e.message}`); continue; }
      setStatus(`${label}: gating sample ${i + 1} (${script.length}B)…`);
      const r = await evaluateScript(script, `${label} s${i}`);
      evals.push(r);
      show(r.fails.length ? 'err' : 'out',
        `  sample ${i}: script ${script.length}B → score ${r.score.toFixed(2)}${r.fails.length ? '  ' + r.fails.slice(0, 3).join(' ') : ''}`);
    }
    if (!evals.length) return null;
    const row = {
      prompt, length: prompt.length,
      best: Math.max(...evals.map(e => e.score)),
      mean: evals.reduce((s, e) => s + e.score, 0) / evals.length,
      fails: [...new Set(evals.flatMap(e => e.fails))],
    };
    rows.push(row);
    return row;
  }

  function leaderboardText(bar) {
    const ranked = [...rows].sort((a, b) => (b.best >= bar) - (a.best >= bar) || b.best - a.best || a.length - b.length).slice(0, 8);
    return ranked.map(r => `${String(r.length).padStart(4)}B  best=${r.best.toFixed(2)}  fails=[${r.fails.join(', ')}]\n  prompt: ${r.prompt}`).join('\n');
  }

  async function search() {
    state.stop = false; state.running = true;
    $('run').hidden = true; $('stop').hidden = false;
    const budget = +$('budget').value || 0;
    const seen = new Set();
    try {
      show('win', `=== evalprout search · ${$('fast').checked ? 'FAST (gate only)' : `full (micro-bench on ${RUNTIME_MODEL})`} · budget ${budget} ===`);
      for (const [i, s] of SEEDS.entries()) {
        if (state.stop) break;
        seen.add(s);
        await scorePrompt(s, `seed ${i}`);
      }
      const bar = Math.max(0.5, ...rows.map(r => r.best));
      show('prose', `\nbar = ${bar.toFixed(2)}`);
      renderBoard(bar);

      for (let it = 1; it <= budget && !state.stop; it++) {
        setStatus(`iter ${it}/${budget}: proposing…`);
        let proposal;
        try {
          proposal = (await llm(GEN_MODEL, [
            { role: 'system', content: PROPOSER_SYS },
            { role: 'user', content: `bar: ${bar.toFixed(2)}\n\nLEADERBOARD:\n${leaderboardText(bar)}\n\nPropose one shorter passing prompt.` },
          ], { temperature: null, seed: it })).trim();
        } catch (e) { show('err', `iter ${it}: proposer failed: ${e.message}`); continue; }
        if (!proposal || seen.has(proposal)) { show('prose', `iter ${it}: dup/empty`); continue; }
        seen.add(proposal);
        await scorePrompt(proposal, `iter ${it}`);
        renderBoard(bar);
      }

      renderBoard(bar);
      const passing = rows.filter(r => r.best >= bar).sort((a, b) => a.length - b.length);
      if (passing.length) {
        show('win', `\n=== shortest passing: ${passing[0].length}B  best=${passing[0].best.toFixed(2)} ===`);
        show('code', passing[0].prompt);
      } else show('err', '\nno passing candidate');
    } finally {
      state.running = false;
      $('run').hidden = false; $('stop').hidden = true;
      setStatus(state.stop ? 'stopped' : 'done');
    }
  }

  $('run').onclick = search;
  $('stop').onclick = () => { state.stop = true; setStatus('stopping after current step…'); };

  // ------------------------------------------------------------------ init
  if (!apiKey) {
    $('auth').hidden = false;
    setStatus('not authorized');
    show('prose', 'click "Authorize" to grant evalprout access to your Pollinations balance (BYOP).');
  } else if (!crossOriginIsolated) {
    setStatus('browser isolation blocked');
    show('err', 'WebContainer needs cross-origin isolation (COOP/COEP headers). Serve via web/serve.js.');
  } else {
    show('prose', 'evalprout: search for the smallest prompt that decompresses into a working Node agent.');
    show('prose', 'every candidate is EXECUTED in this tab: fake-fetch loop trace, then a 6-task micro-bench.');
    await boot();
  }
</script>
